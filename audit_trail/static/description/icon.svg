<!--
  Audit Trail mark.

  SUBJECT  the record being watched, drawn as a card with the rows it keeps.
  ACTION   a clock in its lower-right corner: the module's whole point is that
           every one of those rows carries a "when".

  Two shapes only, and they contrast on purpose — rectangle against circle — so
  at 128px the mark still reads as "a record, timestamped" rather than
  collapsing into a pattern. No ring around the outside: odomate_connector's
  mark already owns that silhouette in the grid.

  The card's bottom-right corner is a real notch, not a corner the clock
  happens to sit on top of: the outline arcs around the clock at a constant
  115px from its centre, so no two strokes cross. Crossed strokes read as
  tangle at thumbnail size, which is the one place this mark has a job to do.
  Two rows, not three — three filled the card and left the notch looking
  cramped.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="52" y1="60" x2="460" y2="452">
      <stop offset="0" stop-color="#5fe7b0"/>
      <stop offset="0.48" stop-color="#5ab4f0"/>
      <stop offset="1" stop-color="#a98bf5"/>
    </linearGradient>
  </defs>

  <!-- SUBJECT: the record card, notched around the clock -->
  <g fill="none" stroke="url(#g)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88 86 H314 A26 26 0 0 1 340 112 V254 A115 115 0 0 0 251 372
             H88 A26 26 0 0 1 62 346 V112 A26 26 0 0 1 88 86 Z"/>
  </g>

  <!-- CONTEXT: the rows it keeps, uneven like real values -->
  <g fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" opacity="0.85">
    <path d="M112 170 H286"/>
    <path d="M112 238 H238"/>
  </g>

  <!-- ACTION: the clock that gives every row a "when" -->
  <g fill="none" stroke="url(#g)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="366" cy="366" r="86"/>
    <path d="M366 314 V366 H406"/>
  </g>
</svg>
