<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="52" y1="60" x2="460" y2="452">
      <stop offset="0" stop-color="#5fe7b0"/>
      <stop offset="0.48" stop-color="#5ab4f0"/>
      <stop offset="1" stop-color="#a98bf5"/>
    </linearGradient>
  </defs>

  <!-- SUBJECT: the discount. Heavier strokes and larger counters than the first
       attempt — a percent drawn thin reads as three unrelated strokes rather
       than one symbol. -->
  <g fill="none" stroke="url(#g)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="130" cy="130" r="58"/>
    <circle cx="272" cy="272" r="58"/>
    <line x1="302" y1="100" x2="100" y2="302"/>
  </g>

  <!-- ACTION: the approval it has to clear. Deliberately NOT enclosed in a
       badge — the percent's counters are already two circles, and a third made
       the mark read as three circles on a diagonal rather than "discount,
       approved". A bare tick has directional form a circle does not, so it
       stays legible as a separate idea at 128px. -->
  <g fill="none" stroke="url(#g)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M326 388 l44 44 l98 -118"/>
  </g>
</svg>
