<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="52" y1="60" x2="460" y2="452">
      <stop offset="0" stop-color="#5fe7b0"/>
      <stop offset="0.48" stop-color="#5ab4f0"/>
      <stop offset="1" stop-color="#a98bf5"/>
    </linearGradient>
  </defs>

  <!-- The badge carries the mark's weight. A percent on its own is an open form
       and reads lighter in the grid than the other modules' marks, which are
       all built on an enclosed shape. -->
  <g fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <rect x="64" y="64" width="384" height="384" rx="64"/>
  </g>

  <!-- The discount itself. Earlier versions paired this with a tick for the
       approval, and the tick had nowhere to sit that did not either collide
       with the lower counter or dangle off the percent's diagonal. Boxing the
       tick instead turned the mark into three circles in a row, because a
       percent is already two. The badge does that work without competing. -->
  <g fill="none" stroke="url(#g)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="196" cy="196" r="48"/>
    <circle cx="316" cy="316" r="48"/>
    <line x1="342" y1="170" x2="170" y2="342"/>
  </g>
</svg>
