<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="52" y1="60" x2="460" y2="452">
      <stop offset="0" stop-color="#5fe7b0"/>
      <stop offset="0.48" stop-color="#5ab4f0"/>
      <stop offset="1" stop-color="#a98bf5"/>
    </linearGradient>
  </defs>

  <!-- SUBJECT: a bound book - the sibling draws a loose sheet, this one is a book
       with a spine, because what this module prints is the day book, the cash book
       and the bank book. -->
  <g fill="none" stroke="url(#g)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 66 H400 Q428 66 428 94 V418 Q428 446 400 446 H170 Q142 446 142 418 V94 Q142 66 170 66 Z"/>
    <path d="M188 66 V446"/>
  </g>

  <!-- ACTION: the day marker - a bookmark ribbon hanging from the top edge into the
       pages. Directional, so it contrasts with the rectangles it sits on, and with
       the sibling's magnifier circle at thumbnail size. -->
  <g fill="none" stroke="url(#g)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <path d="M336 66 V254 L364 224 L392 254 V66"/>
  </g>

  <!-- CONTEXT: two day blocks - a day heading, then its rows. -->
  <g fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" opacity="0.85">
    <line x1="216" y1="132" x2="300" y2="132"/>
    <line x1="216" y1="178" x2="320" y2="178"/>
    <line x1="216" y1="214" x2="296" y2="214"/>
    <line x1="216" y1="300" x2="300" y2="300"/>
    <line x1="216" y1="346" x2="320" y2="346"/>
    <line x1="216" y1="382" x2="288" y2="382"/>
  </g>
</svg>
