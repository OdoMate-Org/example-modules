<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="52" y1="60" x2="460" y2="452">
      <stop offset="0" stop-color="#5fe7b0"/>
      <stop offset="0.48" stop-color="#5ab4f0"/>
      <stop offset="1" stop-color="#a98bf5"/>
    </linearGradient>
  </defs>

  <!-- SUBJECT: the envelope, drawn OPEN so the flap stands up as a triangle.
       Modules 1, 2 and 3 are all built on a rectangle and module 6 on a circle,
       so the triangle is what tells this one apart in the grid - a closed
       envelope would just be another rectangle. -->
  <g fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 72 252 L 256 104 L 440 252"/>
    <rect x="72" y="252" width="368" height="180" rx="24"/>
  </g>

  <!-- ACTION: the two dates the message carries - first day to last day, which is
       the whole mechanic. The bar sits centred between its end ticks so it reads
       as a span; off-centre it reads as a table. No calendar grid: a grid turns
       to mush at 128px. -->
  <g fill="none" stroke="url(#g)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 168 342 H 344"/>
    <path d="M 168 324 V 360"/>
    <path d="M 344 324 V 360"/>
  </g>
</svg>
