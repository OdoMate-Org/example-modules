<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="52" y1="60" x2="460" y2="452">
      <stop offset="0" stop-color="#5fe7b0"/>
      <stop offset="0.48" stop-color="#5ab4f0"/>
      <stop offset="1" stop-color="#a98bf5"/>
    </linearGradient>
  </defs>

  <!-- SUBJECT: the door somebody leaves through, drawn as a frame with its own
       panel so it reads as a passage rather than a slab. An arch on the
       threshold read as a headstone at 128px — the panel and the arrow fixed
       that, and it is the reason this is a rectangle where the arch was. -->
  <g fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 96 436 L 96 92 L 268 92 L 268 436"/>
    <path d="M 224 92 L 224 436"/>
  </g>

  <!-- ACTION: the release — out through the opening, past the frame. Its
       direction is what makes the frame a door. -->
  <g fill="none" stroke="url(#g)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 300 264 L 438 264"/>
    <path d="M 386 212 L 438 264 L 386 316"/>
  </g>

  <!-- CONTEXT: the threshold it stands on. -->
  <g fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" opacity="0.8">
    <path d="M 68 436 L 296 436"/>
  </g>
</svg>
