<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="52" y1="60" x2="460" y2="452">
      <stop offset="0" stop-color="#5fe7b0"/>
      <stop offset="0.48" stop-color="#5ab4f0"/>
      <stop offset="1" stop-color="#a98bf5"/>
    </linearGradient>
  </defs>

  <!-- SUBJECT: the overview panel itself — the one screen the figures live on. -->
  <g fill="none" stroke="url(#g)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <rect x="72" y="96" width="368" height="320" rx="30"/>
  </g>

  <!-- ACTION: the ranking — three columns, the last far taller. That rise IS the
       Bradford result and the turnover trend: one stands out from the rest. -->
  <g fill="none" stroke="url(#g)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <line x1="154" y1="350" x2="154" y2="292"/>
    <line x1="256" y1="350" x2="256" y2="236"/>
    <line x1="358" y1="350" x2="358" y2="170"/>
  </g>

  <!-- CONTEXT: the baseline the columns are measured from. -->
  <g fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" opacity="0.8">
    <line x1="130" y1="368" x2="382" y2="368"/>
  </g>
</svg>
