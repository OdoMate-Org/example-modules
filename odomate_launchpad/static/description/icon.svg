<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- OdoMate brand ramp (banner-template.html .grad): mint -> blue -> violet. -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="52" y1="60" x2="460" y2="452">
      <stop offset="0" stop-color="#5fe7b0"/>
      <stop offset="0.48" stop-color="#5ab4f0"/>
      <stop offset="1" stop-color="#a98bf5"/>
    </linearGradient>
  </defs>

  <!-- the launcher: a grid of app tiles -->
  <g fill="none" stroke="url(#g)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <rect x="76" y="76" width="160" height="160" rx="34"/>
    <rect x="276" y="76" width="160" height="160" rx="34"/>
    <rect x="76" y="276" width="160" height="160" rx="34"/>
    <rect x="276" y="276" width="160" height="160" rx="34"/>
  </g>

  <!-- the pin holding the first tile in place -->
  <g fill="none" stroke="url(#g)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" transform="rotate(35 156 156)">
    <path d="M128 102 H184"/>
    <path d="M140 102 V140 L122 164 H190 L172 140 V102"/>
    <path d="M156 164 V212"/>
  </g>

  <!-- usage: bars in the next tiles, shorter as use drops -->
  <g fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" opacity="0.8">
    <path d="M316 196 V150"/><path d="M356 196 V126"/><path d="M396 196 V168"/>
  </g>
</svg>
